    <!-- Iconos de pestana: inicial de marca en carbon sobre teja crema, para que
         se lea igual en una barra oscura y en una clara.
         Los PNG van primero a proposito: Safari prefiere el icono declarado con
         sizes="any" y no decodifica un .ico con las imagenes comprimidas en PNG,
         asi que ese atributo no se usa y el .ico queda solo como respaldo final. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3D0F18" />
    <meta name="apple-mobile-web-app-title" content="Desquiciado" />
    <!-- SEO Optimization -->
    <title>Desquiciado | Donde la locura se encuentra con la tierra</title>

    <!-- Fonts -->
