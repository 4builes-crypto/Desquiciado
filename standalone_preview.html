<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desquiciado | Preview</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for Preview -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coal: '#1A1A1B',
                        'brand-red': '#691426',
                        cream: '#F5F5DC',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @layer base {
            html {
                scroll-behavior: smooth;
            }

            body {
                background-color: #F5F5DC;
                color: #1A1A1B;
                font-family: 'Inter', sans-serif;
            }

            h1,
            h2,
            h3,
            h4 {
                font-family: 'Playfair Display', serif;
            }
        }

        .wine-glass-glow {
            box-shadow: 0 0 50px rgba(74, 14, 14, 0.1);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Header() {
            const [isScrolled, setIsScrolled] = useState(false);
            useEffect(() => {
                const handle = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handle);
                return () => window.removeEventListener('scroll', handle);
            }, []);

            return (
                <header className={`fixed top-0 w-full z-50 transition-all duration-500 ${isScrolled ? 'bg-cream/90 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 md:px-12 flex justify-between items-center">
                        <a href="#" className="font-serif text-2xl tracking-widest uppercase font-bold text-cream">Desquiciado</a>
                        <nav className="hidden md:flex gap-8 items-center">
                            <a href="#historia" className="text-sm uppercase tracking-wider text-cream/80 hover:text-cream transition-colors">Nuestra Historia</a>
                            <a href="#modelo" className="text-sm uppercase tracking-wider text-cream/80 hover:text-cream transition-colors">Portafolio</a>
                            <a href="#catalogo" className="text-sm uppercase tracking-wider text-cream/80 hover:text-cream transition-colors">Catálogo</a>
                            <a href="#experiencias" className="text-sm uppercase tracking-wider text-cream/80 hover:text-cream transition-colors">Experiencias</a>
                        </nav>
                        <button className="md:hidden text-coal"><i data-lucide="menu"></i></button>
                    </div>
                </header>
            );
        }

        function Hero() {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden bg-coal">
                    <div className="absolute inset-0 opacity-40">
                        <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-brand-red/20 to-transparent" />
                        <div className="absolute bottom-0 left-0 w-[80%] h-[80%] bg-gradient-to-tr from-brand-red/10 to-transparent rounded-full blur-[120px]" />
                    </div>
                    <div className="relative z-10 container mx-auto px-6 md:px-12 text-center flex flex-col items-center mt-20">
                        <p className="text-cream/70 uppercase tracking-[0.3em] text-sm mb-6">Importadora Boutique</p>
                        <h1 className="font-serif text-5xl md:text-8xl text-cream font-light mb-8 max-w-5xl leading-tight">
                            El Arte de<br /> la <span className="italic">Vinicultura</span> Internacional
                        </h1>
                        <p className="text-cream/60 max-w-2xl text-lg md:text-xl font-light mb-12 hidden md:block">
                            Una cuidada selección de etiquetas de alta gama para paladares exigentes.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6">
                            <a href="#catalogo" className="px-8 py-4 bg-cream text-coal hover:bg-cream/90 transition-all tracking-widest uppercase text-xs font-semibold">Explorar Catálogo</a>
                            <a href="#experiencias" className="px-8 py-4 border border-cream/30 text-cream hover:bg-cream/10 transition-all tracking-widest uppercase text-xs font-semibold">Reservar</a>
                        </div>
                    </div>
                </section>
            );
        }

        function Story() {
            return (
                <section id="historia" className="py-32 px-6 md:px-12 bg-cream text-coal">
                    <div className="container mx-auto max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                        <div className="space-y-8">
                            <h2 className="font-serif text-4xl md:text-6xl text-coal leading-tight">Un Legado <br /><span className="italic text-brand-red">Familiar</span></h2>
                            <div className="w-12 h-[2px] bg-brand-red/50"></div>
                            <p className="text-coal/80 text-lg font-light leading-relaxed">
                                Desquiciado nace de una pasión irrenunciable por el vino. No somos solo importadores; somos buscadores de tesoros líquidos que capturen la esencia más pura de la naturaleza.
                                <br /><br />
                                Una de nuestras fundadoras es nuestra sommelier principal, responsable de catar personalmente cada etiqueta. Su paladar experto garantiza que solo los vinos de calidad premium lleguen a su mesa.
                            </p>
                        </div>
                        <div className="bg-coal h-[500px] flex items-center justify-center p-12 relative overflow-hidden">
                            <div className="absolute border border-cream/10 inset-8 flex items-center justify-center">
                                <p className="font-serif text-cream/30 italic text-2xl text-center">"La pureza del terroir global"</p>
                            </div>
                        </div>
                    </div>

                </section>
            );
        }

        function Modelo() {
            return (
                <section id="modelo" className="py-32 px-6 md:px-12 bg-cream text-coal border-t border-coal/5">
                    <div className="container mx-auto max-w-6xl text-center mb-24">
                        <h2 className="font-serif text-5xl md:text-6xl text-coal">Portafolio</h2>
                        <div className="w-20 h-1 bg-brand-red mx-auto mt-6"></div>
                    </div>

                    <div className="container mx-auto max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-12">
                        <div className="space-y-6 p-8 bg-white shadow-sm border-l-4 border-brand-red">
                            <h3 className="font-serif text-2xl">Propuesta de Valor</h3>
                            <ul className="text-sm space-y-3 font-light opacity-80">
                                <li>• Curaduría Experta con criterio certificado.</li>
                                <li>• Asesoría de Sommelier sin costo adicional.</li>
                                <li>• Creación de Eventos Memorables que educan.</li>
                            </ul>
                        </div>
                        <div className="space-y-6 p-8 bg-white shadow-sm border-l-4 border-brand-red">
                            <h3 className="font-serif text-2xl">Líneas de Importación</h3>
                            <ul className="text-sm space-y-3 font-light opacity-80">
                                <li>• <b>Premium:</b> Vinos boutique (Mendoza, San Juan, Salta).</li>
                                <li>• <b>Internacional:</b> España, Italia y Chile.</li>
                                <li>• <b>Accesible:</b> Alta relación calidad-precio.</li>
                            </ul>
                        </div>
                        <div className="space-y-6 p-8 bg-white shadow-sm border-l-4 border-brand-red">
                            <h3 className="font-serif text-2xl">Servicios & Experiencias</h3>
                            <ul className="text-sm space-y-3 font-light opacity-80">
                                <li>• Catas Temáticas y Maridajes.</li>
                                <li>• Workshops Educativos (General/Corp).</li>
                                <li>• Consultoría HORECA.</li>
                                <li>• Kits Corporativos & Catering.</li>
                            </ul>
                        </div>
                    </div>
                </section>
            );
        }

        function Catalog() {
            const wines = [
                { name: "Corte Maestro", bodega: "Finca Los Andes", year: "2018" },
                { name: "Malbec de Altura", bodega: "Viña Alta", year: "2020" },
                { name: "Cabernet Franc", bodega: "Piedemonte", year: "2019" }
            ];
            return (
                <section id="catalogo" className="py-32 bg-coal text-cream px-6">
                    <div className="container mx-auto max-w-7xl">
                        <h2 className="font-serif text-5xl mb-20 text-center">Colección <span className="italic text-brand-red">Selecta</span></h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                            {wines.map(w => (
                                <div key={w.name} className="group">
                                    <div className="h-[400px] bg-cream/5 mb-8 flex items-center justify-center border border-cream/5 group-hover:bg-cream/10 transition-all">
                                        <div className="w-16 h-60 bg-gradient-to-b from-coal to-black border border-cream/10 relative">
                                            <div className="absolute top-20 inset-x-0 h-20 bg-cream text-coal text-[10px] flex items-center justify-center text-center px-1 font-bold">{w.name}</div>
                                        </div>
                                    </div>
                                    <h3 className="font-serif text-2xl">{w.name} <span className="text-brand-red italic text-sm">{w.year}</span></h3>
                                    <p className="text-cream/50 text-xs uppercase tracking-widest mt-2">{w.bodega}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        function Reservation() {
            return (
                <section id="experiencias" className="py-32 bg-cream px-6">
                    <div className="container mx-auto max-w-3xl bg-white p-12 shadow-2xl relative">
                        <div className="absolute top-0 left-0 w-full h-1 bg-brand-red"></div>
                        <h2 className="font-serif text-4xl text-center mb-12">Experiencias <span className="italic text-brand-red">Privadas</span></h2>
                        <div className="space-y-6">
                            <input type="text" placeholder="Nombre" className="w-full border-b border-coal/20 py-3 focus:outline-none focus:border-brand-red bg-transparent font-light" />
                            <input type="email" placeholder="Email" className="w-full border-b border-coal/20 py-3 focus:outline-none focus:border-brand-red bg-transparent font-light" />
                            <button className="w-full py-4 bg-coal text-cream uppercase tracking-widest text-xs font-bold hover:bg-brand-red transition-all mt-8">Solicitar Reserva</button>
                        </div>
                    </div>
                </section>
            );
        }

        function App() {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);
            return (
                <div>
                    <Header />
                    <Hero />
                    <Story />
                    <Modelo />
                    <Catalog />
                    <Reservation />
                    <footer className="bg-coal text-cream py-16 text-center border-t border-cream/10 space-y-4">
                        <p className="font-serif text-2xl tracking-widest mb-4">Desquiciado</p>
                        <div className="text-xs space-y-2 opacity-60 font-light uppercase tracking-widest">
                            <p>desquiciadosas@gmail.com</p>
                            <p>+57 3022943003</p>
                            <p>Retiro, Antioquia, Colombia</p>
                        </div>
                        <p className="opacity-30 text-[10px] uppercase tracking-widest pt-8">&copy; 2026 Importadora Gourmet</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
